[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zoio"
version = "0.1.0"
description = "Servidor leve para ver as câmeras do DVR de casa (Raspberry Pi + Tailscale)"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.8", "cryptography>=3.4"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-aiohttp"]

[project.scripts]
zoio = "zoio.__main__:main"

[tool.setuptools]
packages = ["zoio"]

[tool.setuptools.package-data]
zoio = ["web/*", "web/icons/*"]
