# Placa do portão do Zóio: ESP32 + módulo relé de 1 canal.
#
# O relé fica em paralelo com o botão de abrir (botoeira) do porteiro da rua
# e fecha o contato por um tempo fixo. O tempo está gravado aqui, na placa:
# nem um comando errado do Pi consegue segurar o portão aberto.
#
# Segurança:
# - só a API nativa do ESPHome, cifrada com a chave (a mesma do ZOIO_GATE_KEY);
# - sem servidor web, sem atualização pela rede (OTA) e sem ponto de acesso de
#   emergência: ninguém por perto consegue reconfigurar ou regravar a placa.
#   Para atualizar, ela volta para o USB do Pi.
#
# Os segredos (Wi-Fi e chave) ficam num secrets.yaml gerado no Pi, fora do Git.

substitutions:
  rele_pino: GPIO26     # pino ligado no IN do módulo relé
  rele_invertido: "true"  # a maioria dos módulos aciona com nível baixo
  pulso: 1s             # quanto tempo o contato fica fechado

esphome:
  name: zoio-portao
  friendly_name: Portão
  on_boot:
    priority: 800
    then:
      - output.turn_off: rele

esp32:
  board: esp32dev

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s  # o Zóio só conecta na hora de abrir; não reiniciar por falta de cliente

output:
  - platform: gpio
    id: rele
    pin:
      number: ${rele_pino}
      inverted: ${rele_invertido}

script:
  - id: pulso_rele
    mode: single  # apertos repetidos durante o pulso são ignorados
    then:
      - output.turn_on: rele
      - delay: ${pulso}
      - output.turn_off: rele

button:
  - platform: template
    id: abrir_portao
    name: "Abrir portao"
    icon: mdi:gate-open
    on_press:
      - script.execute: pulso_rele

sensor:
  - platform: wifi_signal
    name: "Sinal Wi-Fi"
    update_interval: 60s
